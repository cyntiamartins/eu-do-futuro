<!doctype html>
<html lang="pt-BR">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
</head>
<body>
<title>Eu do Futuro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0F2A33">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: app de coluna única (máx 560px), cabeçalho fixo e navegação inferior com 4 abas. */
:root{
  --bg:#EEF2F3; --surface:#FFFFFF; --surface-2:#E3EAEC; --ink:#0F2A33; --muted:#557079; --line:#CCD8DB;
  --accent:#0B7A6A; --accent-ink:#FFFFFF; --accent-soft:#D2EEE8;
  --warn:#B66A00; --warn-soft:#FBEBCF; --danger:#B8392A; --danger-soft:#F8DDD8;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B171B; --surface:#12232A; --surface-2:#1A3039; --ink:#E6F0F2; --muted:#93AEB6; --line:#27434D;
  --accent:#3CC4AB; --accent-ink:#06201B; --accent-soft:#143C36;
  --warn:#F0B04A; --warn-soft:#3A2C12; --danger:#F07A68; --danger-soft:#3D1D19; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0B171B; --surface:#12232A; --surface-2:#1A3039; --ink:#E6F0F2; --muted:#93AEB6; --line:#27434D;
  --accent:#3CC4AB; --accent-ink:#06201B; --accent-soft:#143C36;
  --warn:#F0B04A; --warn-soft:#3A2C12; --danger:#F07A68; --danger-soft:#3D1D19; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 110px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px 4px}
.brand{font-family:var(--display);font-weight:800;font-size:1.15rem;letter-spacing:-.01em}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:.75rem;color:var(--muted);letter-spacing:.02em}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.75rem;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.section{display:flex;flex-direction:column;gap:12px;padding-block:18px;border-top:1px solid var(--line)}
.section:first-of-type{border-top:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.block{width:100%}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.92rem}
input[type=text],textarea,select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;font-weight:400}
textarea{min-height:76px;resize:vertical}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:.9rem;min-height:38px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.75rem;font-weight:700;letter-spacing:.03em}
.pill.calmo{background:var(--accent-soft);color:var(--accent)}
.pill.atencao{background:var(--warn-soft);color:var(--warn)}
.pill.urgente{background:var(--danger-soft);color:var(--danger)}
.pill.soon{background:var(--surface-2);color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* Eu do Futuro: o único bloco com fundo escuro forte do app */
.future{border-radius:20px;padding:20px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;color:#EAF4F2;background:#0F2A33;position:relative;overflow:hidden}
.future::after{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;border-radius:50%;background:var(--glow);opacity:.35;filter:blur(30px)}
.future.calmo{--glow:#3CC4AB}.future.atencao{--glow:#F0B04A}.future.urgente{--glow:#F07A68}
.future .who{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:#9FC3BD}
.future .meta{font-family:var(--display);font-size:1.3rem;font-weight:800;line-height:1.15;margin-block:4px}
.future .carta{font-style:italic;color:#C9DEDA;font-size:.95rem}
.future .next{margin-top:8px;font-weight:600;font-size:.92rem}
.future .pill{margin-top:8px}
.future .pill.calmo{background:#16443D;color:#7FE3CF}.future .pill.atencao{background:#4A3713;color:#F7C873}.future .pill.urgente{background:#4E221C;color:#FF9E8F}
.ring{position:relative;width:96px;height:96px;z-index:1}
.ring svg{width:96px;height:96px;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ring .lbl b{font-family:var(--mono);font-size:1.6rem}
.ring .lbl span{font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;color:#9FC3BD;margin-top:3px}
.future > div{position:relative;z-index:1;min-width:0}

/* Tarefa mínima */
.must{display:flex;gap:14px;align-items:center;cursor:pointer;border:2px dashed var(--line);border-radius:var(--r);padding:16px;background:var(--surface)}
.must.done{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.box{flex:none;width:34px;height:34px;border-radius:10px;border:2px solid var(--ink);display:grid;place-items:center;font-weight:800}
.must.done .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* Pilares */
.pilares{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pilar{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:96px}
.pilar .d{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.pilar b{font-family:var(--display);font-size:1rem;line-height:1.2}
.pilar.hoje{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pilar.feito b::after{content:" ✓";color:var(--accent)}
ol.passos{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.timer{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--surface-2);border-radius:var(--r);padding:14px}
.timer .clock{font-family:var(--mono);font-size:2.2rem;font-weight:700}

/* Progresso */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat b{display:block;font-family:var(--mono);font-size:1.5rem}
.stat span{font-size:.78rem;color:var(--muted)}
.heat{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--surface-2);max-width:100%}
.heat i.ok{background:var(--accent)} .heat i.miss{background:var(--danger-soft)} .heat i.today{outline:2px solid var(--ink);outline-offset:1px}
.radar{display:block;width:100%;max-width:340px;margin:0 auto}

/* Onboarding */
.steps{display:flex;gap:6px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--accent)}
.slider{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.slider input{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.slider output{font-family:var(--mono);font-weight:700}
.ciclo{border-left:3px solid var(--accent);padding-left:12px;display:flex;flex-direction:column;gap:6px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));z-index:5}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:0;padding:10px 4px 12px;font-weight:600;font-size:.8rem;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;z-index:9}
.note{font-size:.85rem;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--danger-soft);border-radius:10px;padding:10px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs" hidden><div class="in">
  <button data-tab="hoje"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg>Hoje</button>
  <button data-tab="meta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>Meta</button>
  <button data-tab="metodo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>Método</button>
  <button data-tab="progresso"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Progresso</button>
</div></nav>

<script>
/* =========================================================
   Eu do Futuro — v1 (MVP local)
   Dados ficam no aparelho (localStorage). Fase 3 troca por Firebase.
   Regra da IA: o app nunca inventa dados da pessoa; tudo que aparece
   foi digitado por ela ou é cálculo direto do que ela registrou.
   ========================================================= */
const VERSAO = "1.0.0";
const KEY = "eudofuturo_v1";

const AREAS = [
  ["saude","Saúde e corpo"],["mente","Mente e emoções"],["espirito","Espiritualidade"],["familia","Família"],
  ["relacoes","Relacionamentos"],["carreira","Carreira e trabalho"],["dinheiro","Finanças"],["lazer","Lazer e alegria"]
];

/* Os 7 pilares do Método de Excelência Diária, um por dia da semana (seg = 1) */
const PILARES = [
  {id:"manha", dia:1, nome:"Domínio da manhã", ideia:"Começar o dia com intenção antes de reagir ao mundo.",
   missao:"Escreva as 3 prioridades do dia antes de abrir redes sociais.",
   passos:["Ao acordar, beba água e fique 2 minutos sem celular.","Pergunte: o que faria hoje valer a pena?","Escreva 3 prioridades, da mais importante para a menos.","Marque qual delas é a tarefa mínima da sua meta."],
   campo:"Minhas 3 prioridades de hoje", min:5},
  {id:"foco", dia:2, nome:"Controle do foco", ideia:"Uma tarefa por vez, sem interrupções.",
   missao:"Faça um bloco de foco com notificações desligadas.",
   passos:["Escolha UMA tarefa.","Coloque o celular no modo silencioso, longe da mão.","Inicie o cronômetro e trabalhe só nela.","Se surgir distração, anote e volte."],
   campo:"Tarefa que vai receber o bloco de foco", min:25},
  {id:"disciplina", dia:3, nome:"Autodisciplina", ideia:"Cumprir promessas pequenas fortalece a confiança em si.",
   missao:"Faça uma promessa que cabe em 5 minutos e cumpra agora.",
   passos:["Escreva um compromisso que dá para cumprir em 5 minutos.","Inicie o cronômetro.","Faça até o fim, mesmo sem vontade.","Registre: promessa cumprida."],
   campo:"Meu compromisso de 5 minutos", min:5},
  {id:"consistencia", dia:4, nome:"Consistência", ideia:"Falhar um dia acontece. A regra é nunca falhar dois seguidos.",
   missao:"Faça a versão mínima do seu hábito, mesmo num dia ruim.",
   passos:["Defina a menor versão possível do hábito (ex.: 1 flexão, 1 página).","Inicie o cronômetro de 1 minuto.","Faça só isso. Se quiser continuar, continue.","Se falhou ontem, hoje é o dia de retomar."],
   campo:"A versão mínima do meu hábito", min:1},
  {id:"padroes", dia:5, nome:"Padrões pessoais", ideia:"Comportamentos escolhidos de acordo com seus valores.",
   missao:"Escreva uma regra pessoal no formato “Eu sou alguém que…”.",
   passos:["Pense num valor que importa para você.","Transforme em comportamento visível.","Escreva: “Eu sou alguém que…”.","Aplique a regra uma vez hoje."],
   campo:"Eu sou alguém que…", min:0},
  {id:"acao", dia:6, nome:"Ação decisiva", ideia:"Começar diminui o peso da procrastinação.",
   missao:"Comece em 2 minutos aquilo que você vem adiando.",
   passos:["Escreva a tarefa que você está adiando.","Defina o primeiro passo físico (abrir o arquivo, pegar o tênis).","Inicie o cronômetro de 5 minutos e só comece.","Ao final, decida se continua."],
   campo:"O que venho adiando e qual o primeiro passo", min:5},
  {id:"resiliencia", dia:0, nome:"Resiliência", ideia:"Dificuldade vira aprendizado quando é revisada com calma.",
   missao:"Revise uma dificuldade da semana e tire um próximo passo dela.",
   passos:["O que aconteceu? (só os fatos)","O que estava no meu controle?","O que eu aprendi?","Qual é o próximo passo pequeno?"],
   campo:"Fato, aprendizado e próximo passo", min:0}
];
const HUMORES = ["Animada(o)","Tranquila(o)","Cansada(o)","Ansiosa(o)","Desanimada(o)"];

/* ---------- utilidades ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n=>String(n).padStart(2,"0");
const dkey = d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hoje = ()=>dkey(new Date());
const parseKey = k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
const addDays = (k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return dkey(d)};
const diff = (a,b)=>Math.round((parseKey(b)-parseKey(a))/86400000);
const fmtData = k=>parseKey(k).toLocaleDateString("pt-BR",{day:"2-digit",month:"short"});

function load(){try{const raw=localStorage.getItem(KEY);return raw?JSON.parse(raw):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){} }
let S = load() || {perfil:null};
let tab = "hoje", ob = {passo:0, d:{}}, pilarAberto = null, confirmReset=false;

function trat(f,m,n){const t=S.perfil?.tratamento;return t==="ele"?m:t==="neutro"?n:f}
function dia(k=hoje()){S.dias=S.dias||{};return S.dias[k]=S.dias[k]||{minima:false,missoes:{},checkin:{},revisao:{}}}
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}

/* ---------- cálculo do Eu do Futuro ---------- */
function status(){
  const m=S.meta; if(!m) return null;
  const k=hoje(); const total=m.dias;
  const passados=Math.min(Math.max(diff(m.inicio,k)+1,1),total);
  const restantes=Math.max(total-diff(m.inicio,k),0);
  let feitos=0; for(let i=0;i<passados;i++){if(S.dias?.[addDays(m.inicio,i)]?.minima) feitos++}
  // faltas seguidas antes de hoje
  let faltas=0; for(let i=1;i<=3;i++){const kk=addDays(k,-i); if(diff(m.inicio,kk)<0)break; if(!S.dias?.[kk]?.minima) faltas++; else break}
  const anteriores=Math.max(passados-1,0);
  const feitosAnt = feitos - (dia(k).minima?1:0);
  const taxa = anteriores? feitosAnt/anteriores : 1;
  const tempo = passados/total;
  let nivel="calmo";
  if(faltas>=2 || (tempo>.5 && taxa<.5)) nivel="urgente";
  else if(faltas===1 || taxa<.75 || (restantes<=15 && !dia(k).minima)) nivel="atencao";
  const ciclo = Math.min(Math.floor((passados-1)/(total/3)),2);
  return {passados,restantes,feitos,faltas,taxa,tempo,nivel,ciclo,pct:Math.round(feitos/total*100)};
}
const NIVEL_TXT={calmo:"No ritmo",atencao:"Atenção",urgente:"Urgente"};
function recado(st){
  const n=S.perfil?.nome||"";
  if(st.nivel==="urgente") return st.faltas>=2?`${n}, foram ${st.faltas} dias sem a tarefa mínima. Hoje é o dia de retomar, nem que seja a versão menor.`:`Mais da metade do prazo passou e o ritmo está abaixo de 50%. Faça a tarefa mínima agora.`;
  if(st.nivel==="atencao") return st.faltas===1?`Ontem ficou sem registro. Regra do método: nunca falhar dois dias seguidos.`:st.restantes<=15?`Faltam ${st.restantes} dias. Cada dia conta mais agora.`:`Seu ritmo está abaixo de 75%. A tarefa mínima de hoje recoloca você no trilho.`;
  return dia().minima?`Tarefa de hoje feita. ${trat("Você está construindo quem quer ser.","Você está construindo quem quer ser.","Você está construindo quem quer ser.")}`:`Você está no ritmo. Falta só a tarefa mínima de hoje.`;
}

/* ---------- telas ---------- */
function render(){
  const app=$("#app");
  if(!S.perfil){ $("#tabs").hidden=true; app.innerHTML=telaOnboarding(); bindOnboarding(); return; }
  $("#tabs").hidden=false;
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===tab?"page":"false"));
  const head=`<header class="top"><div class="brand">Eu do Futuro<small>Crescendo um dia de cada vez</small></div>${S.exemplo?'<span class="pill soon">EXEMPLO</span>':''}<button class="btn ghost" id="bt-perfil" aria-label="Perfil e ajustes">${esc((S.perfil.nome||"?")[0].toUpperCase())}</button></header>`;
  const body = tab==="hoje"?telaHoje():tab==="meta"?telaMeta():tab==="metodo"?telaMetodo():tab==="progresso"?telaProgresso():telaPerfil();
  app.innerHTML=head+body; bindTela();
}

function cardFuturo(){
  const st=status(); const m=S.meta;
  const C=2*Math.PI*42, off=C*(1-Math.min(st.feitos/m.dias,1));
  const cor={calmo:"#3CC4AB",atencao:"#F0B04A",urgente:"#F07A68"}[st.nivel];
  const marco=m.marcos?.[st.ciclo]||"";
  return `<section class="future ${st.nivel}" aria-label="Mensagem do seu eu do futuro">
    <div><div class="who">Seu eu do futuro · dia ${st.passados} de ${m.dias}</div>
      <div class="meta">${esc(m.titulo)}</div>
      ${m.carta?`<div class="carta">“${esc(m.carta)}”</div>`:""}
      <div class="next">${esc(recado(st))}</div>
      ${marco?`<div class="carta" style="font-style:normal;margin-top:6px">Marco do ciclo ${st.ciclo+1}: ${esc(marco)}</div>`:""}
      <span class="pill ${st.nivel}">${NIVEL_TXT[st.nivel].toUpperCase()}</span></div>
    <div class="ring"><svg viewBox="0 0 96 96"><circle cx="48" cy="48" r="42" stroke="#24434C" stroke-width="8" fill="none"/><circle cx="48" cy="48" r="42" stroke="${cor}" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg>
      <div class="lbl"><b>${st.restantes}</b><span>dias</span></div></div>
  </section>`;
}

function telaHoje(){
  const d=dia(); const k=hoje(); const p=PILARES.find(x=>x.dia===new Date().getDay());
  const dt=new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
  return `<div class="stack">
  <div><div class="eyebrow">${esc(dt)}</div><h1>Olá, ${esc(S.perfil.nome)}.</h1></div>

function telaProgresso(){
  const st=status(); const m=S.meta;
  let seq=0; for(let i=0;i<400;i++){const k=addDays(hoje(),-i); if(S.dias?.[k]?.minima) seq++; else if(i>0) break;}
  const missoes=Object.values(S.dias||{}).reduce((a,d)=>a+Object.keys(d.missoes||{}).length,0);
  const cells=[]; if(m){for(let i=0;i<m.dias;i++){const k=addDays(m.inicio,i);const fut=diff(hoje(),k)>0;const ok=S.dias?.[k]?.minima;cells.push(`<i class="${ok?"ok":(!fut&&k!==hoje()?"miss":"")} ${k===hoje()?"today":""}" title="${fmtData(k)}"></i>`)}}
  return `<div class="stack"><div><div class="eyebrow">Placar de disciplina</div><h1>Seu progresso</h1></div>
  <div class="stats"><div class="stat"><b>${st?st.feitos:0}</b><span>dias cumpridos</span></div><div class="stat"><b>${seq}</b><span>sequência atual</span></div><div class="stat"><b>${missoes}</b><span>missões feitas</span></div></div>
  ${m?`<div class="section"><div class="row" style="justify-content:space-between"><h3>Mapa dos ${m.dias} dias</h3><span class="muted num" style="font-size:.85rem">${st.pct}% do total</span></div><div class="heat">${cells.join("")}</div>
  <div class="row muted" style="font-size:.8rem;gap:14px"><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--accent)"></i> cumprido</span><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--danger-soft)"></i> sem registro</span></div></div>`:""}
  ${S.roda?`<div class="section"><h3>Roda da Vida</h3>${radar(S.roda)}<button class="btn" id="bt-refazer-roda" style="align-self:flex-start">Refazer diagnóstico</button></div>`:""}
  ${historico()}
  </div>`;

function historico(){
  const ks=Object.keys(S.dias||{}).filter(k=>S.dias[k].revisao?.funcionou||S.dias[k].revisao?.melhorar).sort().reverse().slice(0,5);
  if(!ks.length) return "";
  return `<div class="section"><h3>Últimas revisões</h3>${ks.map(k=>{const r=S.dias[k].revisao;return `<div class="panel"><div class="row" style="justify-content:space-between"><b>${fmtData(k)}</b>${r.nota?`<span class="num muted">nota ${r.nota}/5</span>`:""}</div>${r.funcionou?`<div><span class="eyebrow">Funcionou</span><br>${esc(r.funcionou)}</div>`:""}${r.melhorar?`<div><span class="eyebrow">Melhorar</span><br>${esc(r.melhorar)}</div>`:""}</div>`}).join("")}</div>`;
}
function radar(r){
  const N=AREAS.length,cx=170,cy=150,R=100; const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/N;return [cx+Math.cos(a)*R*v/10,cy+Math.sin(a)*R*v/10]};
  const grid=[2,4,6,8,10].map(v=>`<polygon points="${AREAS.map((_,i)=>pt(i,v).join(",")).join(" ")}" fill="none" stroke="var(--line)"/>`).join("");
  const poly=AREAS.map((a,i)=>pt(i,r[a[0]]).join(",")).join(" ");
  const lbl=AREAS.map((a,i)=>{const [x,y]=pt(i,12.6);const anc=Math.abs(x-cx)<5?"middle":x>cx?"start":"end";return `<text x="${x}" y="${y}" text-anchor="${anc}" dominant-baseline="middle" font-size="11" fill="var(--muted)">${a[1].split(" ")[0]} ${r[a[0]]}</text>`}).join("");
  return `<svg class="radar" viewBox="0 0 340 300" role="img" aria-label="Roda da Vida">${grid}<polygon points="${poly}" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2"/>${lbl}</svg>`;
}

function bindOnboarding(){
  const d=ob.d;
  chipGroup("#ob-trat",v=>d.tratamento=v);

  AREAS.forEach(a=>{const r=$("#r-"+a[0]); if(r) r.oninput=()=>{d.roda[a[0]]=Number(r.value);$("#o-"+a[0]).textContent=r.value}});

    ob.passo++;render();window.scrollTo(0,0);
  });
}

}

/* ---------- eventos das telas ---------- */
function chipGroup(sel,cb){const g=$(sel); if(!g) return; g.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{g.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");cb&&cb(b.dataset.v)})}
function bindTela(){
  $("#bt-perfil")?.addEventListener("click",()=>{tab="perfil";render()});
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{tab=b.dataset.go;render()});
  document.querySelectorAll("[data-pilar]").forEach(b=>b.onclick=()=>{pilarAberto=b.dataset.pilar;tab="metodo";render();window.scrollTo(0,0)});
  // Hoje
  const must=$("#must"); if(must){const tg=()=>{const d=dia();d.minima=!d.minima;save();render();if(d.minima)toast("Tarefa mínima feita")};must.onclick=tg;must.onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();tg()}}}
  document.querySelectorAll("[data-ck]").forEach(g=>g.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{const d=dia();const k=g.dataset.ck;d.checkin[k]=k==="energia"?Number(b.dataset.v):b.dataset.v;save();render()}));
  document.querySelectorAll("[data-rv]").forEach(g=>g.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{g.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true")}));
  $("#rv-salvar")?.addEventListener("click",()=>{const d=dia();d.revisao={funcionou:$("#rv-ok").value.trim(),melhorar:$("#rv-mel").value.trim(),nota:Number(document.querySelector('[data-rv] [aria-pressed="true"]')?.dataset.v||0)||null};save();toast("Revisão salva")});
  // Meta
  chipGroup("#m-dias");
  $("#bt-edit-meta")?.addEventListener("click",()=>{S.editMeta=true;render()});
  $("#bt-nova-meta")?.addEventListener("click",()=>{S.metasAnteriores=[...(S.metasAnteriores||[]),S.meta];S.meta=null;render()});
  $("#bt-cancel-meta")?.addEventListener("click",()=>{S.editMeta=false;render()});
  $("#bt-salvar-meta")?.addEventListener("click",()=>{const m=lerMeta(S.meta||{});if(!m)return;S.meta=m;S.editMeta=false;save();render();toast("Meta salva")});
  // Método
  $("#bt-voltar")?.addEventListener("click",()=>{pilarAberto=null;render()});
  document.querySelectorAll("[data-min]").forEach(b=>b.onclick=()=>{pararTimer();timer.total=Number(b.dataset.min)*60;timer.rest=timer.total;timer.pid=pilarAberto;document.querySelectorAll("[data-min]").forEach(x=>x.setAttribute("aria-pressed",x===b));$("#clock").textContent=fmtT(timer.rest)});
  $("#bt-timer")?.addEventListener("click",()=>{ if(timer.t){pararTimer();render();return}
    const p=PILARES.find(x=>x.id===pilarAberto); if(timer.pid!==pilarAberto||!timer.rest){timer.total=(p.min||5)*60;timer.rest=timer.total;timer.pid=pilarAberto}
    timer.t=setInterval(()=>{timer.rest--; const c=$("#clock"); if(c) c.textContent=fmtT(Math.max(timer.rest,0)); if(timer.rest<=0){pararTimer();toast("Tempo concluído");try{navigator.vibrate&&navigator.vibrate(300)}catch(e){} if(tab==="metodo")render()}},1000); render()});
  $("#bt-concluir")?.addEventListener("click",()=>{const d=dia();const h=new Date();d.missoes[pilarAberto]={texto:$("#pl-txt").value.trim(),hora:`${pad(h.getHours())}:${pad(h.getMinutes())}`};save();render();toast("Missão registrada")});
  // Progresso
  $("#bt-refazer-roda")?.addEventListener("click",()=>{ob={passo:1,d:{nome:S.perfil.nome,tratamento:S.perfil.tratamento,roda:{...S.roda},refazer:true}};telaRoda()});
  // Perfil
  chipGroup("#pf-trat");
  $("#pf-salvar")?.addEventListener("click",()=>{S.perfil.nome=$("#pf-nome").value.trim()||S.perfil.nome;S.perfil.tratamento=document.querySelector('#pf-trat [aria-pressed="true"]')?.dataset.v||S.perfil.tratamento;save();toast("Salvo");render()});
  $("#bt-voltar-hoje")?.addEventListener("click",()=>{tab="hoje";render()});
  $("#bt-reset")?.addEventListener("click",()=>{confirmReset=true;render()});
  $("#rs-nao")?.addEventListener("click",()=>{confirmReset=false;render()});
  $("#rs-sim")?.addEventListener("click",()=>{try{localStorage.removeItem(KEY)}catch(e){} S={perfil:null};confirmReset=false;ob={passo:0,d:{}};tab="hoje";render()});
}
function telaRoda(){
  const d=ob.d; const app=$("#app");
  app.innerHTML=`<div class="stack"><h1>Refazer diagnóstico</h1>${AREAS.map(a=>`<div class="slider"><label for="r-${a[0]}">${a[1]}</label><output id="o-${a[0]}" class="num">${d.roda[a[0]]}</output><input type="range" min="0" max="10" id="r-${a[0]}" value="${d.roda[a[0]]}"></div>`).join("")}<div class="row"><button class="btn ghost" id="rd-c">Cancelar</button><button class="btn primary" id="rd-s" style="flex:1">Salvar</button></div></div>`;
  AREAS.forEach(a=>{const r=$("#r-"+a[0]); r.oninput=()=>{d.roda[a[0]]=Number(r.value);$("#o-"+a[0]).textContent=r.value}});
  $("#rd-c").onclick=()=>render(); $("#rd-s").onclick=()=>{S.rodaHistorico=[...(S.rodaHistorico||[]),{data:hoje(),roda:S.roda}];S.roda=d.roda;save();render();toast("Diagnóstico atualizado")};
}
function pararTimer(){if(timer.t){clearInterval(timer.t);timer.t=null}}

document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;pilarAberto=null;S.editMeta=false;render();window.scrollTo(0,0)});
render();

/* Instalação como app (PWA) — só funciona quando publicado no GitHub Pages */
if("serviceWorker" in navigator && location.protocol==="https:" && !location.hostname.includes("claude")){
  try{navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
}
</script>
